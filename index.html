<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACNET Family - Bus Tracker</title>
    <style>
        /* Base Dark Background with subtle ambient glow */
        body {
            margin: 0;
            padding: 0;
            background-color: #0D1110;
            background-image: radial-gradient(circle at 50% 20%, #1a2e22 0%, #0D1110 70%);
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Device Frame Container */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 780px;
            box-sizing: border-box;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Header Info */
        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #00FF66;
            text-transform: uppercase;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            color: #A0AAB0;
        }

        /* See-Through Frosted Glass Card */
        .glass-card {
            background: rgba(58, 50, 34, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .eta-label {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #00FF66;
            text-transform: uppercase;
            font-weight: 700;
        }

        .eta-time {
            font-size: 3rem;
            font-weight: 900;
            color: #FFE033;
            margin: 8px 0 4px 0;
            text-shadow: 0 0 12px rgba(255, 224, 51, 0.4);
        }

        .accuracy-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid rgba(0, 255, 102, 0.4);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #00FF66;
            margin-bottom: 20px;
        }

        .status-box {
            font-size: 0.82rem;
            color: #D1D5DB;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* Cyber Lime Confirmation Button */
        .btn-confirm {
            background: #00FF66;
            color: #0D1110;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            border: none;
            border-radius: 14px;
            padding: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn-confirm:active {
            transform: scale(0.98);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
        }

        /* Bottom Intelligence Details */
        .intelligence-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 14px;
            border-left: 3px solid #FFE033;
            font-size: 0.78rem;
            color: #A0AAB0;
            line-height: 1.6;
        }

        .intelligence-panel strong {
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top App Header -->
        <div class="header">
            <h2>TACNET FAMILY</h2>
            <p>Bus 12 &bull; Elon Rd Stop</p>
        </div>

        <!-- Central Frosted Glass Container -->
        <div class="glass-card">
            <div class="eta-label">Dynamic Predicted ETA</div>
            <div class="eta-time" id="etaDisplay">7:26 AM</div>
            <div class="accuracy-badge" id="accuracyDisplay">Accuracy: &plusmn;2 min (Learned)</div>

            <div class="status-box" id="statusBox">
                Bus left depot at 7:12 AM.<br>Route 29 traffic is clear.
            </div>

            <!-- Tap Button -->
            <button class="btn-confirm" onclick="confirmArrival()">
                BUS IS HERE NOW
            </button>
        </div>

        <!-- Route Logic Panel -->
        <div class="intelligence-panel">
            <strong>Route Intelligence</strong><br>
            &bull; Scheduled Arrival: 7:28 AM<br>
            &bull; Your 3-Day Average: 7:26 AM<br>
            &bull; Mode: Solo Mother Vault (Learning from your taps)
        </div>
    </div>

    <script>
        function confirmArrival() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Interactive state update on tap
            document.getElementById('etaDisplay').innerText = timeString;
            document.getElementById('accuracyDisplay').innerText = "Confirmed by You Today";
            document.getElementById('statusBox').innerHTML = "<span style='color:#00FF66;'>✓ Bus Arrival Logged!</span><br>Recalibrating model for tomorrow.";
        }
    </script>
</body>
</html>
