<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TACNET Family</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #eef2f5;
      color: #17212b;
    }

    .app {
      max-width: 430px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 20px;
    }

    header h1 {
      font-size: 27px;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 5px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .network {
      margin: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    .network strong {
      color: #047857;
    }

    .section {
      padding: 0 16px 16px;
    }

    .section h2 {
      margin-bottom: 10px;
      font-size: 19px;
    }

    .member {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px;
      margin-bottom: 9px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .member-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .name {
      font-weight: bold;
    }

    .location {
      color: #64748b;
      font-size: 13px;
      margin-top: 3px;
    }

    .live {
      color: #059669;
      font-size: 12px;
      font-weight: bold;
    }

    #map {
      height: 330px;
      width: calc(100% - 32px);
      margin: 0 16px 18px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
    }

    .map-title {
      padding: 0 16px 10px;
      font-size: 19px;
      font-weight: bold;
    }

    .sos {
      display: block;
      width: calc(100% - 32px);
      margin: 0 16px 20px;
      padding: 19px;
      border: none;
      border-radius: 13px;
      background: #dc2626;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>TACNET FAMILY</h1>
    <p>Your family. One connected safety network.</p>
  </header>

  <div class="network">
    🟢 <strong>Family Network Active</strong><br>
    <span style="font-size:13px;">
      Family location demonstration is active.
    </span>
  </div>

  <div class="section">
    <h2>Your Family</h2>

    <div class="member">
      <div class="member-left">
        <div class="avatar">J</div>
        <div>
          <div class="name">Jack</div>
          <div class="location">School</div>
        </div>
      </div>
      <div class="live">● LIVE</div>
    </div>

    <div class="member">
      <div class="member-left">
        <div class="avatar">S</div>
        <div>
          <div class="name">Sarah</div>
          <div class="location">Home</div>
        </div>
      </div>
      <div class="live">● LIVE</div>
    </div>

    <div class="member">
      <div class="member-left">
        <div class="avatar">M</div>
        <div>
          <div class="name">Mom</div>
          <div class="location">Work</div>
        </div>
      </div>
      <div class="live">● LIVE</div>
    </div>

  </div>

  <div class="map-title">
    🌎 Family Live Map
  </div>

  <div id="map"></div>

  <button class="sos" onclick="showSOS()">
    🔴 FAMILY SOS
  </button>

  <footer>
    TACNET Family<br>
    Connected family safety technology
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /*
    DEMONSTRATION ONLY

    These locations are fixed demonstration coordinates.
    They are NOT real people and NOT real-time GPS.
  */

  const map = L.map('map').setView([38.9072, -77.0369], 12);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  let jackLat = 38.9072;
let jackLng = -77.0369;

const jack = L.marker([jackLat, jackLng])
  .addTo(map)
  .bindPopup(`
    <b>JACK</b><br>
    🟢 LIVE DEMO<br>
    Location: Moving<br>
    Battery: 78%
  `);

const route = [
  [38.9072, -77.0369],
  [38.9090, -77.0355],
  [38.9110, -77.0340],
  [38.9130, -77.0320],
  [38.9150, -77.0300],
  [38.9170, -77.0280],
  [38.9190, -77.0260],
  [38.9210, -77.0240]
];

let position = 0;

setInterval(() => {

  position++;

  if (position >= route.length) {
    position = 0;
  }

  jackLat = route[position][0];
  jackLng = route[position][1];

  jack.setLatLng([jackLat, jackLng]);

}, 3000);

  const sarah = L.marker([38.8951, -77.0364])
    .addTo(map)
    .bindPopup("<b>Sarah</b><br>Home<br>● LIVE DEMO");

  const mom = L.marker([38.9167, -77.0178])
    .addTo(map)
    .bindPopup("<b>Mom</b><br>Work<br>● LIVE DEMO");


  function showSOS() {

    alert(
      "🔴 TACNET FAMILY SOS\n\n" +
      "Emergency demonstration activated.\n\n" +
      "A future production version will send the authorized family emergency alert together with the member's current location."
    );

  }

</script>

</body>
</html>
