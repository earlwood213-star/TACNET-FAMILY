<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACNET FAMILY - Assurance Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #060B11;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Mobile Device Frame Container */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 812px;
            background: #0B131E;
            border-radius: 36px;
            border: 2px solid #00B2FF;
            box-shadow: 0 0 30px rgba(0, 178, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Navigation Header */
        .header {
            padding: 18px 20px 12px 20px;
            background: rgba(11, 19, 30, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 178, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00B2FF;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
            font-size: 1.1rem;
        }

        /* Segmented View Toggle (Map / List) */
        .toggle-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 3px;
            margin: 10px 20px;
            border: 1px solid rgba(0, 178, 255, 0.3);
        }

        .toggle-btn {
            flex: 1;
            padding: 6px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            color: #8A99AD;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: #00B2FF;
            color: #060B11;
            box-shadow: 0 0 10px rgba(0, 178, 255, 0.5);
        }

        /* Scrollable Main Content Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 20px 16px;
        }

        /* Satellite Map Card Container */
        .map-card {
            height: 220px;
            border-radius: 20px;
            background: linear-gradient(rgba(0, 20, 10, 0.6), rgba(0, 0, 0, 0.8)),
                        radial-gradient(circle at 50% 50%, #004d25 0%, #060B11 100%);
            border: 1px solid rgba(0, 255, 102, 0.4);
            position: relative;
            margin-bottom: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .map-badge {
            align-self: flex-start;
            background: rgba(0, 255, 102, 0.2);
            border: 1px solid #00FF66;
            color: #00FF66;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .map-route-visual {
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 3px;
            background: #00FF66;
            box-shadow: 0 0 10px #00FF66;
            transform: translateY(-50%);
        }

        .map-node {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .node-home { left: 15%; background: #00B2FF; box-shadow: 0 0 10px #00B2FF; }
        .node-bus { left: 50%; background: #FFE033; box-shadow: 0 0 12px #FFE033; }
        .node-school { left: 85%; background: #00FF66; box-shadow: 0 0 10px #00FF66; }

        /* Family Member Status Cards */
        .child-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 178, 255, 0.25);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .child-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1A293D;
            border: 2px solid #00B2FF;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: #00B2FF;
            font-size: 0.9rem;
        }

        .child-details h4 {
            font-size: 0.95rem;
            color: #FFFFFF;
            margin-bottom: 2px;
        }

        .child-details p {
            font-size: 0.75rem;
            color: #8A99AD;
        }

        .status-pill {
            background: rgba(0, 255, 102, 0.15);
            color: #00FF66;
            border: 1px solid rgba(0, 255, 102, 0.4);
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 10px;
        }

        /* Bus Status Module */
        .bus-card {
            background: rgba(255, 224, 51, 0.08);
            border: 1px solid rgba(255, 224, 51, 0.3);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bus-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #FFE033;
        }

        .bus-sub {
            font-size: 0.75rem;
            color: #D1D5DB;
            margin-top: 2px;
        }

        /* Red Emergency SOS Button */
        .btn-sos {
            background: linear-gradient(180deg, #FF2A2A 0%, #A80000 100%);
            color: #FFFFFF;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            border: none;
            border-radius: 18px;
            padding: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-sos:active {
            transform: scale(0.98);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.8);
        }

        /* Bottom Tab Navigation Bar */
        .bottom-nav {
            height: 65px;
            background: #080E17;
            border-top: 1px solid rgba(0, 178, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #5A6E85;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: #00B2FF;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                🛡️ TACNET FAMILY
            </div>
            <div class="header-icons">
                <span>🔔</span>
                <span>⚙️</span>
            </div>
        </div>

        <!-- Map / List Mode Toggle -->
        <div class="toggle-bar">
            <div class="toggle-btn active" id="btnMap" onclick="setMode('map')">Map View</div>
            <div class="toggle-btn" id="btnList" onclick="setMode('list')">List View</div>
        </div>

        <!-- Scrollable Dashboard Content -->
        <div class="content-scroll">
            
            <!-- Live Satellite Route View -->
            <div class="map-card" id="mapSection">
                <div class="map-badge">● LIVE SATELLITE TRACKING</div>
                <div class="map-route-visual">
                    <div class="map-node node-home" title="Home"></div>
                    <div class="map-node node-bus" title="Bus 12"></div>
                    <div class="map-node node-school" title="School"></div>
                </div>
                <div style="font-size: 0.78rem; color: #A3E6C5; text-shadow: 0 0 4px #000;">
                    Bus 12 &bull; 2 mins away from Elon Rd Stop
                </div>
            </div>

            <!-- Family Member Cards -->
            <div class="child-card">
                <div class="child-info">
                    <div class="avatar">JK</div>
                    <div class="child-details">
                        <h4>Jack</h4>
                        <p>At School &bull; Arrived 8:12 AM</p>
                    </div>
                </div>
                <div class="status-pill">LIVE</div>
            </div>

            <div class="child-card">
                <div class="child-info">
                    <div class="avatar" style="border-color:#FFE033; color:#FFE033;">SR</div>
                    <div class="child-details">
                        <h4>Sarah</h4>
                        <p>On Bus 12 &bull; Pickup 7:26 AM</p>
                    </div>
                </div>
                <div class="status-pill" style="color:#FFE033; border-color:#FFE033; background:rgba(255,224,51,0.15);">ON BUS</div>
            </div>

            <!-- Bus Intelligence Card -->
            <div class="bus-card">
                <div>
                    <div class="bus-title">🚌 Bus 12 Route Intelligence</div>
                    <div class="bus-sub">Next Stop: Elon Rd (ETA 7:26 AM)</div>
                </div>
                <div style="font-size:0.75rem; color:#00FF66; font-weight:700;">Clear</div>
            </div>

            <!-- Emergency Red Action Button -->
            <button class="btn-sos" onclick="triggerSOS()">
                🚨 FAMILY SOS EMERGENCY
            </button>

        </div>

        <!-- Bottom App Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span>🏠</span>
                <span>Home</span>
            </div>
            <div class="nav-item">
                <span>🗺️</span>
                <span>Map</span>
            </div>
            <div class="nav-item">
                <span>🚌</span>
                <span>Tracking</span>
            </div>
            <div class="nav-item">
                <span>🔔</span>
                <span>Alerts</span>
            </div>
        </div>

    </div>

    <script>
        function setMode(mode) {
            const mapBtn = document.getElementById('btnMap');
            const listBtn = document.getElementById('btnList');
            const mapSection = document.getElementById('mapSection');

            if (mode === 'map') {
                mapBtn.classList.add('active');
                listBtn.classList.remove('active');
                mapSection.style.display = 'flex';
            } else {
                listBtn.classList.add('active');
                mapBtn.classList.remove('active');
                mapSection.style.display = 'none';
            }
        }

        function triggerSOS() {
            alert("🚨 FAMILY SOS ACTIVATED: Emergency notifications sent to family network.");
        }
    </script>
</body>
</html>
